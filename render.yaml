# Render Blueprint — SHUT portfolio (static site)
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
services:
  - type: static
    name: shut-portfolio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # No environment variables needed — the site is fully static,
    # no database, no secrets.
